spring.application.name=OTOProject

# --- porta (o Render define PORT; localmente fica 8080)
server.port=${PORT:8080}

# --- banco de dados (PostgreSQL)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- Docker Compose
# ao rodar, o Spring Boot executa o compose.yaml e conecta no banco sozinho.
# o banco continua no ar quando a aplicação para:
# se quiser desligar: docker compose stop. Fora do desenvolvimento esta parte não tem efeito.
spring.docker.compose.lifecycle-management=start-only

# --- flyway
# O flyway aplica os scripts de db/migration na subida.
spring.flyway.locations=classpath:db/migration
# falha a subida se um script estiver fora do padrão V<n>__descricao.sql
spring.flyway.validate-migration-naming=true


# --- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- segurança (login com JWT) ----------
# segredo que assina os tokens de login: pelo menos 32 caracteres, definido no .env
# (gere com: openssl rand -hex 32). Se trocar o segredo, desconecta todo mundo.
oto.jwt.segredo=${JWT_SEGREDO:}
# Validade do token. Depois disso o usuÃ¡rio faz login de novo.
oto.jwt.expiracao=8h

# endereços do front autorizados a chamar a API (separados por vírgula).
# lembrete: em produção, trocar pelo endereço real do front em CORS_ORIGENS no .env.
oto.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*}

# primeiro administrador, criado na subida se ainda não existir um usuário com
# este e-mail. Depois de entrar, é possível a senha pelo sistema.
oto.admin-inicial.nome=${ADMIN_NOME:Administrador OTO}
oto.admin-inicial.email=${ADMIN_EMAIL:}
oto.admin-inicial.senha=${ADMIN_SENHA:}

# --- pesquisas ---------------
# Dias depois do prazo de resposta em que o PARCEIRO ainda consegue responder.
# Passado esse limite, sÃ³ a equipe do OTO (ADMIN) lanÃ§a as respostas. Prorrogar o prazo libera de novo.
oto.pesquisa.dias-de-tolerancia=${PESQUISA_DIAS_TOLERANCIA:30}
# Fuso usado para contar "hoje" e o fim dos prazos.
oto.fuso-horario=America/Sao_Paulo

# --- erros ----
# Todos os erros da API no formato Problem Details (RFC 9457).
spring.mvc.problemdetails.enabled=true

# --- upload (importação de série histórica) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- variável do seeder ----
oto.demo.popular=${OTO_DEMO_POPULAR:false}
