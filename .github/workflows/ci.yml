name: CI

on:
  push:
    branches: [main, oto-development]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Criar .env de teste
        run: |
          cat > .env <<EOF
          POSTGRES_DB=oto_ci
          POSTGRES_USER=oto_ci
          POSTGRES_PASSWORD=senha-so-de-ci
          DB_PORT=5432
          JWT_SEGREDO=$(openssl rand -hex 32)
          ADMIN_EMAIL=admin@oto.test
          ADMIN_SENHA=senha-de-ci-123
          EOF

      - name: Build e testes
        run: ./gradlew build

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: build/reports/tests/test
  imagem:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/pedrob21/oto-project:latest