spring.application.name=OTOProject

# --- Banco de dados (PostgreSQL)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- Docker Compose
# Ao rodar pela IDE ou com bootRun, o Spring Boot executa o compose.yaml e
# conecta no banco sozinho. O banco continua no ar quando a aplicação para:
# Para desligar: docker compose stop. Fora do desenvolvimento esta parte não tem efeito.
spring.docker.compose.lifecycle-management=start-only

# --- Flyway
# O flyway aplica os scripts de db/migration na subida.
spring.flyway.locations=classpath:db/migration
# Falha a subida se um script estiver fora do padrão V<n>__descricao.sql
spring.flyway.validate-migration-naming=true


# --- JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Segurança (login com JWT) -----------------------------------------------
# Segredo que assina os tokens de login: pelo menos 32 caracteres, definido no .env
# (gere com: openssl rand -hex 32). Trocar o segredo desconecta todo mundo.
oto.jwt.segredo=${JWT_SEGREDO:}
# Validade do token. Depois disso o usuário faz login de novo.
oto.jwt.expiracao=8h

# Endereços do front autorizados a chamar a API (separados por vírgula).
# Em produção, troque pelo endereço real do front em CORS_ORIGENS no .env.
oto.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*}

# Primeiro administrador, criado na subida se ainda não existir um usuário com
# este e-mail. Depois de entrar, troque a senha pelo sistema.
oto.admin-inicial.nome=${ADMIN_NOME:Administrador OTO}
oto.admin-inicial.email=${ADMIN_EMAIL:}
oto.admin-inicial.senha=${ADMIN_SENHA:}

# --- Erros -------------------------------------------------------------------
# Todos os erros da API no formato Problem Details (RFC 9457).
spring.mvc.problemdetails.enabled=true

# --- Upload (importação da série histórica) ----------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

